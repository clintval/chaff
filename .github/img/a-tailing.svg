<svg xmlns="http://www.w3.org/2000/svg" width="870" height="172" viewBox="0 0 870 172" role="img" aria-labelledby="title">
  <title id="title">How A-tailing makes an error: end repair trims a 3′ end one base too far, A-tailing adds a non-templated A where a C belongs, the UMI-bearing adapters are ligated, and only that strand reads A at the last base of its 3′ end, so the two strands disagree.</title>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; }
    .head { fill: #57606a; font-size: 13px; font-weight: 700; }
    .ink { fill: #57606a; font-size: 12.5px; }
    .end { fill: #12875c; font-size: 12px; }
    .base { fill: #8c8b86; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .alt { fill: #e34948; font-weight: 700; }
    .new { fill: #2a78d6; font-weight: 700; }
    .fill { fill: #2a78d6; fill-opacity: 0.14; }
    .umi { fill: #12875c; }
    .arrow { stroke: #8c8b86; stroke-width: 1.5; fill: none; }
    .read { fill: #8c8b86; fill-opacity: 0.11; }
    @media (prefers-color-scheme: dark) {
      .head, .ink { fill: #9198a1; }
      .end, .umi { fill: #1baf7a; }
      .read { fill: #ffffff; fill-opacity: 0.12; }
    }
  </style>

  <text class="head" x="28" y="24">1. An over-digested end</text>
  <text class="ink" x="28" y="42">end repair trims a base too many</text>
  <text class="ink" x="28" y="160">the top strand's 3′ end is short</text>
  <rect class="read" x="36" y="81" width="136" height="23" rx="4"/>
  <rect class="read" x="36" y="107" width="151" height="23" rx="4"/>
  <text class="end" x="28" y="98" text-anchor="middle">5′</text>
  <text class="end" x="181" y="98" text-anchor="middle">3′</text>
  <text class="end" x="28" y="124" text-anchor="middle">3′</text>
  <text class="end" x="196" y="124" text-anchor="middle">5′</text>
  <text class="base" y="98" text-anchor="middle"><tspan x="44 59 74 89 104 119 134 149 164">CTGCGAGGT</tspan></text>
  <text class="base" y="124" text-anchor="middle"><tspan x="44 59 74 89 104 119 134 149 164 179">GACGCTCCAG</tspan></text>
  <path class="arrow" d="M209 111 h16 m-5 -4 l5 4 l-5 4"/>

  <text class="head" x="243" y="24">2. An A is added</text>
  <text class="ink" x="243" y="42">A-tailing adds a non-templated A</text>
  <text class="ink" x="243" y="160">where a C belongs</text>
  <rect class="read" x="251" y="81" width="151" height="23" rx="4"/>
  <rect class="read" x="251" y="107" width="151" height="23" rx="4"/>
  <text class="end" x="243" y="98" text-anchor="middle">5′</text>
  <text class="end" x="411" y="98" text-anchor="middle">3′</text>
  <text class="end" x="243" y="124" text-anchor="middle">3′</text>
  <text class="end" x="411" y="124" text-anchor="middle">5′</text>
  <text class="base" y="98" text-anchor="middle"><tspan x="259 274 289 304 319 334 349 364 379">CTGCGAGGT</tspan><tspan class="alt" x="394">A</tspan></text>
  <text class="base" y="124" text-anchor="middle"><tspan x="259 274 289 304 319 334 349 364 379 394">GACGCTCCAG</tspan></text>
  <path class="arrow" d="M424 111 h16 m-5 -4 l5 4 l-5 4"/>

  <text class="head" x="458" y="24">3. Adapters are ligated</text>
  <text class="ink" x="458" y="42">each carries a UMI</text>
  <text class="ink" x="458" y="160">the A is on one strand</text>
  <rect class="umi" x="451" y="86" width="14" height="15" rx="3"/>
  <rect class="umi" x="618" y="86" width="14" height="15" rx="3"/>
  <rect class="umi" x="451" y="112" width="14" height="15" rx="3"/>
  <rect class="umi" x="618" y="112" width="14" height="15" rx="3"/>
  <rect class="read" x="466" y="81" width="151" height="23" rx="4"/>
  <rect class="read" x="466" y="107" width="151" height="23" rx="4"/>
  <text class="base" y="98" text-anchor="middle"><tspan x="474 489 504 519 534 549 564 579 594">CTGCGAGGT</tspan><tspan class="alt" x="609">A</tspan></text>
  <text class="base" y="124" text-anchor="middle"><tspan x="474 489 504 519 534 549 564 579 594 609">GACGCTCCAG</tspan></text>
  <path class="arrow" d="M639 111 h16 m-5 -4 l5 4 l-5 4"/>

  <text class="head" x="673" y="24">4. The strands disagree</text>
  <text class="ink" x="673" y="42">one strand reads A</text>
  <text class="ink" x="673" y="160">at the last base of its 3′ end</text>
  <rect class="read" x="681" y="81" width="151" height="23" rx="4"/>
  <rect class="read" x="681" y="107" width="151" height="23" rx="4"/>
  <text class="base" y="98" text-anchor="middle"><tspan x="689 704 719 734 749 764 779 794 809">CTGCGAGGT</tspan><tspan class="alt" x="824">A</tspan></text>
  <text class="base" y="124" text-anchor="middle"><tspan x="689 704 719 734 749 764 779 794 809 824">CTGCGAGGTC</tspan></text>
</svg>
