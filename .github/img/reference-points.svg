<svg xmlns="http://www.w3.org/2000/svg" width="880" height="190" viewBox="0 0 880 190" role="img" aria-labelledby="title">
  <title id="title">One fragment with the end each artifact sits near: copied damage, a lesion marked on its base, at the lesion strand's 5′ end, end repair fill-in at the extended strand's 3′ end, and an added A at a terminal 3′ base.</title>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; }
    .ink { fill: #57606a; font-size: 13px; }
    .head { fill: #57606a; font-size: 13px; font-weight: 700; }
    .end { fill: #12875c; font-size: 13px; }
    .base { fill: #8c8b86; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .alt { fill: #e34948; font-weight: 700; }
    .new { fill: #2a78d6; font-weight: 700; }
    .rule { stroke: #8c8b86; stroke-width: 1; fill: none; }
    .fill { fill: #2a78d6; fill-opacity: 0.14; }
    .read { fill: #8c8b86; fill-opacity: 0.11; }
    .lesion { fill: #e34948; }
    .lesion-stem { stroke: #e34948; stroke-width: 1.5; }
    .lesion-label { fill: #e34948; font-size: 10px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .head, .ink { fill: #9198a1; }
      .end { fill: #1baf7a; }
      .read { fill: #ffffff; fill-opacity: 0.12; }
    }
  </style>

  <text class="head" x="120" y="24">Copied damage</text>
  <text class="ink" x="120" y="42">sits near the lesion strand's 5′ end</text>

  <text class="head" x="760" y="24" text-anchor="end">A-tailing</text>
  <text class="ink" x="760" y="42" text-anchor="end">adds an A at a 3′ end's last base</text>
  <path class="rule" d="M759 48 V70"/>

  <rect class="read" x="120" y="71" width="648" height="23" rx="4"/>
  <rect class="read" x="120" y="97" width="648" height="23" rx="4"/>
  <path class="lesion-stem" d="M165 76 V63"/>
  <circle class="lesion" cx="165" cy="59.5" r="3.5"/>
  <text class="lesion-label" x="172" y="62.5">U</text>
  <text class="end" x="100" y="88" text-anchor="middle">5′</text>
  <text class="base" y="88" text-anchor="middle"><tspan x="129 147">AT</tspan><tspan class="alt" x="165">T</tspan><tspan x="183 201 219 237 255 273 291 309 327 345 363 381 399 417 435 453 471 489 507 525 543 561 579 597 615 633 651 669 687 705 723 741">GACTGGTCAAGTCCATGCTAGGACTTCAGGCT</tspan><tspan class="alt" x="759">A</tspan></text>
  <text class="end" x="786" y="88" text-anchor="middle">3′</text>

  <rect class="fill" x="120" y="97" width="126" height="23" rx="4"/>
  <text class="end" x="100" y="114" text-anchor="middle">3′</text>
  <text class="base" y="114" text-anchor="middle"><tspan class="new" x="129 147">TA</tspan><tspan class="alt" x="165">A</tspan><tspan class="new" x="183 201">CT</tspan><tspan class="alt" x="219">T</tspan><tspan class="new" x="237">A</tspan><tspan x="255 273 291 309 327 345 363 381 399 417 435 453 471 489 507 525 543 561 579 597 615 633 651 669 687 705 723 741 759">CCAGTTCAGGTACGATCCTGAAGTCCGAG</tspan></text>
  <text class="end" x="786" y="114" text-anchor="middle">5′</text>

  <path class="rule" d="M219 122 V146"/>
  <text class="head" x="120" y="164">End repair fill-in</text>
  <text class="ink" x="120" y="182">errs in the new bases, blue, near the extended strand's 3′ end</text>
</svg>
