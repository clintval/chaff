<svg xmlns="http://www.w3.org/2000/svg" width="870" height="172" viewBox="0 0 870 172" role="img" aria-labelledby="title">
  <title id="title">How copied damage makes a call: a methylated C at a CpG is deaminated to T near one strand's 5′ end, a polymerase fills in the partner's recessed 3′ end and copies the T as an A, the UMI-bearing adapters are ligated, and both strands carry the change, so the two strands agree and Duplex Sequencing calls it.</title>
  <style>
    text { font-family: Helvetica, Arial, sans-serif; }
    .head { fill: #57606a; font-size: 13px; font-weight: 700; }
    .ink { fill: #57606a; font-size: 12.5px; }
    .end { fill: #12875c; font-size: 12px; }
    .base { fill: #8c8b86; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
    .alt { fill: #e34948; font-weight: 700; }
    .new { fill: #2a78d6; font-weight: 700; }
    .fill { fill: #2a78d6; fill-opacity: 0.14; }
    .umi { fill: #12875c; }
    .arrow { stroke: #8c8b86; stroke-width: 1.5; fill: none; }
    .read { fill: #8c8b86; fill-opacity: 0.11; }
    .lesion { fill: #e34948; }
    .lesion-stem { stroke: #e34948; stroke-width: 1.5; }
    .lesion-label { fill: #e34948; font-size: 10px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .head, .ink { fill: #9198a1; }
      .end, .umi { fill: #1baf7a; }
      .read { fill: #ffffff; fill-opacity: 0.12; }
    }
  </style>

  <text class="head" x="28" y="24">1. A lesion near a 5′ end</text>
  <text class="ink" x="28" y="42">a methylated C is deaminated to T</text>
  <text class="ink" x="28" y="160">the partner's 3′ end is recessed</text>
  <rect class="read" x="36" y="81" width="151" height="23" rx="4"/>
  <rect class="read" x="111" y="107" width="76" height="23" rx="4"/>
  <text class="end" x="28" y="98" text-anchor="middle">5′</text>
  <text class="end" x="196" y="98" text-anchor="middle">3′</text>
  <text class="end" x="103" y="124" text-anchor="middle">3′</text>
  <text class="end" x="196" y="124" text-anchor="middle">5′</text>
  <path class="lesion-stem" d="M89 86 V73"/>
  <circle class="lesion" cx="89" cy="69.5" r="3.5"/>
  <text class="lesion-label" x="96" y="72.5">5mC→T</text>
  <text class="base" y="98" text-anchor="middle"><tspan x="44 59 74">CTG</tspan><tspan class="alt" x="89">T</tspan><tspan x="104 119 134 149 164 179">GAGGAT</tspan></text>
  <text class="base" y="124" text-anchor="middle"><tspan x="119 134 149 164 179">TCCTA</tspan></text>
  <path class="arrow" d="M209 111 h16 m-5 -4 l5 4 l-5 4"/>

  <text class="head" x="243" y="24">2. It is filled in</text>
  <text class="ink" x="243" y="42">a polymerase extends the 3′ end</text>
  <text class="ink" x="243" y="160">and copies the T as an A</text>
  <rect class="read" x="251" y="81" width="151" height="23" rx="4"/>
  <rect class="read" x="251" y="107" width="151" height="23" rx="4"/>
  <rect class="fill" x="251" y="107" width="76" height="23" rx="4"/>
  <text class="end" x="243" y="98" text-anchor="middle">5′</text>
  <text class="end" x="411" y="98" text-anchor="middle">3′</text>
  <text class="end" x="243" y="124" text-anchor="middle">3′</text>
  <text class="end" x="411" y="124" text-anchor="middle">5′</text>
  <path class="lesion-stem" d="M304 86 V73"/>
  <circle class="lesion" cx="304" cy="69.5" r="3.5"/>
  <text class="lesion-label" x="311" y="72.5">5mC→T</text>
  <text class="base" y="98" text-anchor="middle"><tspan x="259 274 289">CTG</tspan><tspan class="alt" x="304">T</tspan><tspan x="319 334 349 364 379 394">GAGGAT</tspan></text>
  <text class="base" y="124" text-anchor="middle"><tspan class="new" x="259 274 289">GAC</tspan><tspan class="alt" x="304">A</tspan><tspan class="new" x="319">C</tspan><tspan x="334 349 364 379 394">TCCTA</tspan></text>
  <path class="arrow" d="M424 111 h16 m-5 -4 l5 4 l-5 4"/>

  <text class="head" x="458" y="24">3. Adapters are ligated</text>
  <text class="ink" x="458" y="42">each carries a UMI</text>
  <text class="ink" x="458" y="160">the change is on both strands</text>
  <rect class="umi" x="451" y="86" width="14" height="15" rx="3"/>
  <rect class="umi" x="618" y="86" width="14" height="15" rx="3"/>
  <rect class="umi" x="451" y="112" width="14" height="15" rx="3"/>
  <rect class="umi" x="618" y="112" width="14" height="15" rx="3"/>
  <rect class="read" x="466" y="81" width="151" height="23" rx="4"/>
  <rect class="read" x="466" y="107" width="151" height="23" rx="4"/>
  <path class="lesion-stem" d="M519 86 V73"/>
  <circle class="lesion" cx="519" cy="69.5" r="3.5"/>
  <text class="lesion-label" x="526" y="72.5">5mC→T</text>
  <text class="base" y="98" text-anchor="middle"><tspan x="474 489 504">CTG</tspan><tspan class="alt" x="519">T</tspan><tspan x="534 549 564 579 594 609">GAGGAT</tspan></text>
  <text class="base" y="124" text-anchor="middle"><tspan x="474 489 504">GAC</tspan><tspan class="alt" x="519">A</tspan><tspan x="534 549 564 579 594 609">CTCCTA</tspan></text>
  <path class="arrow" d="M639 111 h16 m-5 -4 l5 4 l-5 4"/>

  <text class="head" x="673" y="24">4. The strands agree</text>
  <text class="ink" x="673" y="42">each strand's consensus shows T</text>
  <text class="ink" x="673" y="160">so Duplex Sequencing calls it</text>
  <rect class="read" x="681" y="81" width="151" height="23" rx="4"/>
  <rect class="read" x="681" y="107" width="151" height="23" rx="4"/>
  <text class="base" y="98" text-anchor="middle"><tspan x="689 704 719">CTG</tspan><tspan class="alt" x="734">T</tspan><tspan x="749 764 779 794 809 824">GAGGAT</tspan></text>
  <text class="base" y="124" text-anchor="middle"><tspan x="689 704 719">CTG</tspan><tspan class="alt" x="734">T</tspan><tspan x="749 764 779 794 809 824">GAGGAT</tspan></text>
</svg>
