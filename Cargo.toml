[package]
name = "chaff"
version = "0.1.0"
authors = ["Clint Valentine <valentine.clint@gmail.com>"]
edition = "2021"
license = "MIT"
readme = "README.md"
repository = "https://github.com/clintval/chaff"
description = "Separate somatic variant calls from library-preparation damage artifacts."
categories = ["command-line-utilities", "science"]
keywords = ["bioinformatics", "somatic", "duplex", "artifact", "vcf"]

[profile.release]
codegen-units = 1
lto = "fat"

# Shipped artifacts (bioconda etc.): the release settings plus no debug info and a stripped binary.
[profile.dist]
inherits = "release"
codegen-units = 1
lto = "fat"
debug = 0
incremental = false
strip = true

[lib]
name = "chaff"
path = "src/lib/mod.rs"

[[bin]]
name = "chaff"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "wrap_help"] }
csv = "1"
env_logger = "0.11"
log = "0.4"
mimalloc = "0.1"
noodles = { version = "0.115", features = ["bam", "bcf", "bgzf", "core", "fasta", "sam", "vcf"] }
noodles-bgzf = { version = "0.51", features = ["libdeflate"] }
serde = { version = "1", features = ["derive"] }
statrs = "0.18"
streampile = { git = "https://github.com/clintval/streampile", rev = "ab73ca290252e4368d71cf67789a73b703af5d84" }

[dev-dependencies]
assert_cmd = "2"
clap = { version = "4", features = ["derive"] }
csv = "1"
cucumber = "0.21"
futures = "0.3"
rstest = "0.26"
tempfile = "3"

[[test]]
name = "cucumber"
harness = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin_include)'] }
